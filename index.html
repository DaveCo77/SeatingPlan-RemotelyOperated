<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Kiosk Display</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400;700&family=Open+Sans:wght@300;400;600&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;600&family=Oswald:wght@300;400;600&family=Raleway:wght@300;400;600&family=Poppins:wght@300;400;600&family=Nunito:wght@300;400;600&family=Merriweather:wght@300;400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-main: 'Helvetica Neue', Arial, sans-serif;
            --highlight: #0056b3;
            --highlight-text: #ffffff;
            --title-size: 3.5rem;
            --table-size: 1.4rem;
            --guest-size: 1.2rem;
            --top-clearance: 25vh;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: var(--font-main);
            color: var(--text-color);
            text-shadow: 0px 4px 15px rgba(0,0,0,0.9), 0px 1px 3px rgba(0,0,0,0.8);
            transition: color 0.3s, font-family 0.3s;
            background-color: var(--bg-color);
            /* ── Background image: place your JPEG alongside this HTML file ── */
            background-image: url('QLD_Forum SeatPlan Background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .display-area {
            display: flex; flex-direction: column; align-items: center;
            padding: var(--top-clearance) 3rem 3rem 3rem;
            max-width: 1400px; margin: 0 auto;
        }

        /* ── Idle / active mode ── */
        body.idle-mode #main-content-container  { opacity: 0.25; transition: opacity 2s ease-in-out; }
        body.active-mode #main-content-container { opacity: 1;    transition: opacity 0.5s ease-in-out; }
        body.idle-mode .search-container input  { border-color: rgba(255,255,255,0.5); animation: borderPulse 4s infinite ease-in-out; }
        body.idle-mode .nav-btn,
        body.idle-mode .page-indicators         { opacity: 0.1; transition: opacity 2s ease-in-out; }
        body.active-mode .nav-btn,
        body.active-mode .page-indicators       { opacity: 1;   transition: opacity 0.5s ease-in-out; }

        @keyframes borderPulse {
            0%   { box-shadow: 0 0 0   rgba(255,255,255,0); }
            50%  { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
            100% { box-shadow: 0 0 0   rgba(255,255,255,0); }
        }

        /* ── Floorplan (shown when uploaded) ── */
        #floorplan-container { display: none; margin-bottom: 2rem; width: 100%; text-align: center; }
        #floorplan-display   { max-height: 500px; max-width: 100%; border: 2px solid var(--text-color); object-fit: contain; }

        /* ── Header ── */
        .chart-header {
            text-align: center; margin-bottom: 2rem;
            display: flex; align-items: center; justify-content: center; gap: 2rem;
        }
        .chart-header h1 { font-size: var(--title-size); text-transform: uppercase; margin: 0; transition: font-size 0.3s; }

        /* ── Search bar ── */
        .search-container {
            width: 100%; max-width: 800px; text-align: center;
            margin: 0 auto 4rem auto;
            position: relative;
            z-index: 1000;
        }

        #searchInput {
            width: 100%; padding: 1.2rem; font-size: 1.5rem; font-family: inherit;
            border: 2px solid var(--text-color); border-radius: 8px;
            background: rgba(0,0,0,0.6); color: var(--text-color);
            text-align: center; outline: none; transition: all 0.5s; cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #searchInput::placeholder { color: var(--text-color); opacity: 0.7; }
        #searchInput:focus { border-color: var(--highlight); background: rgba(0,0,0,0.85); }

        /* ── Main seating content ── */
        #main-content-container { width: 100%; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }

        .seating-page {
            width: 100%; margin-bottom: 3rem;
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }
        .seating-page.active.layout-grid    { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4rem; }
        .seating-page.active.layout-columns { display: block; column-count: 3; column-gap: 4rem; }
        .seating-page.active.layout-list    { display: flex; flex-direction: column; align-items: center; gap: 3rem; }

        @media (max-width: 1000px) { .seating-page.active.layout-columns { column-count: 2; } }
        @media (max-width:  600px) { .seating-page.active.layout-columns { column-count: 1; } }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Table groups ── */
        .table-group { text-align: center; margin-bottom: 2rem; break-inside: avoid; page-break-inside: avoid; }
        .table-group h3 {
            font-size: var(--table-size);
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 0.5rem; display: inline-block;
            transition: font-size 0.3s;
        }
        .table-group ul { list-style: none; padding: 0; margin: 0; line-height: 1.8; font-size: var(--guest-size); transition: font-size 0.3s; }

        /* ── Guest items ── */
        .guest-item {
            transition: all 0.2s; padding: 0.5rem 0; border-radius: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .guest-name    { font-weight: normal; }
        .guest-details { font-size: 0.65em; opacity: 0.7; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

        /* Search highlight / fade states */
        .guest-item.highlight {
            background-color: var(--highlight); color: var(--highlight-text);
            transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0,0.9);
        }
        .guest-item.highlight .guest-name { font-weight: bold; }
        .guest-item.fade    { opacity: 0.2; }
        .guest-item.hidden  { display: none; }

        /* ── Page indicators ── */
        .page-indicators { display: flex; gap: 15px; margin-top: 2rem; align-items: center; }
        .dot {
            width: 16px; height: 16px; border-radius: 50%;
            background: rgba(255,255,255,0.2); transition: all 0.3s; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .dot:hover  { background: rgba(255,255,255,0.6); transform: scale(1.1); }
        .dot.active { background: var(--text-color); transform: scale(1.3); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* ── Nav arrows ── */
        .nav-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            font-size: 3rem; color: rgba(255,255,255,0.3);
            cursor: pointer; padding: 2rem; z-index: 100;
            transition: all 0.3s; user-select: none;
            display: none;
        }
        .nav-btn:hover  { color: rgba(255,255,255,0.8); }
        .nav-btn:active { transform: translateY(-50%) scale(0.9); }
        .nav-btn.left  { left: 1rem; }
        .nav-btn.right { right: 1rem; }

        /* ── On-screen keyboard — drops down from search bar ── */
        #custom-keyboard {
            position: absolute;
            top: calc(100% + 15px);
            left: 0; width: 100%;
            background: rgba(15,15,15,0.95);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
            /* Hidden state */
            opacity: 0; visibility: hidden; transform: translateY(-20px);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 200;
        }
        #custom-keyboard.active { opacity: 1; visibility: visible; transform: translateY(0); }

        .kb-row { display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 1000px; }

        .kb-key {
            background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            padding: 20px 0; font-size: 1.4rem; font-family: var(--font-main);
            cursor: pointer; flex-grow: 1; flex-basis: 0;
            user-select: none; transition: all 0.1s;
        }
        .kb-key:active      { background: rgba(255,255,255,0.3); transform: scale(0.95); }
        .kb-key.wide        { flex-grow: 2; font-size: 1.1rem; letter-spacing: 1px; font-weight: bold; }
        .kb-key.space       { flex-grow: 6; }
        .kb-key.action-clear { background: rgba(179,0,0,0.3); }
        .kb-key.action-close { background: rgba(0,86,179,0.4); }
    </style>
</head>
<body class="active-mode">

    <div class="nav-btn left"  id="nav-prev">&#10094;</div>
    <div class="nav-btn right" id="nav-next">&#10095;</div>

    <main class="display-area">

        <div id="floorplan-container">
            <img id="floorplan-display" src="" alt="Floorplan">
        </div>

        <div class="chart-header">
            <img id="logo-display" src="" alt="Event Logo" style="display:none; max-height:120px;">
            <h1>Seating Chart</h1>
        </div>

        <!-- Search bar + keyboard dropdown (keyboard is a child so it inherits position:relative) -->
        <div class="search-container" id="search-wrapper">
            <input type="text" id="searchInput" placeholder="TAP HERE TO SEARCH YOUR NAME" readonly>

            <div id="custom-keyboard">
                <div class="kb-row">
                    <button class="kb-key">Q</button><button class="kb-key">W</button>
                    <button class="kb-key">E</button><button class="kb-key">R</button>
                    <button class="kb-key">T</button><button class="kb-key">Y</button>
                    <button class="kb-key">U</button><button class="kb-key">I</button>
                    <button class="kb-key">O</button><button class="kb-key">P</button>
                </div>
                <div class="kb-row" style="width:95%">
                    <button class="kb-key">A</button><button class="kb-key">S</button>
                    <button class="kb-key">D</button><button class="kb-key">F</button>
                    <button class="kb-key">G</button><button class="kb-key">H</button>
                    <button class="kb-key">J</button><button class="kb-key">K</button>
                    <button class="kb-key">L</button>
                </div>
                <div class="kb-row" style="width:90%">
                    <button class="kb-key">Z</button><button class="kb-key">X</button>
                    <button class="kb-key">C</button><button class="kb-key">V</button>
                    <button class="kb-key">B</button><button class="kb-key">N</button>
                    <button class="kb-key">M</button>
                    <button class="kb-key wide" id="kb-backspace">DELETE</button>
                </div>
                <div class="kb-row">
                    <button class="kb-key wide action-clear" id="kb-clear">CLEAR</button>
                    <button class="kb-key space"             id="kb-space">SPACE</button>
                    <button class="kb-key wide action-close" id="kb-close">DONE</button>
                </div>
            </div>
        </div>

        <div id="main-content-container">
            <p style="text-align:center;width:100%;">Awaiting data from Cloud Database...</p>
        </div>

        <div class="page-indicators" id="page-indicators"></div>
    </main>

    <script>
        // ─────────────────────────────────────────────
        // 1. FIREBASE CONFIG
        // ─────────────────────────────────────────────
        const firebaseConfig = {
            apiKey:            "AIzaSyBsdmq5cRa56FkA--ZHJCNeQK30CqNKOUg",
            authDomain:        "mondrian-seating-plan.firebaseapp.com",
            databaseURL:       "https://mondrian-seating-plan-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId:         "mondrian-seating-plan",
            storageBucket:     "mondrian-seating-plan.firebasestorage.app",
            messagingSenderId: "10687041872",
            appId:             "1:10687041872:web:eae592e4f9191f2ddc1c55",
            measurementId:     "G-EYY57Q0WZ9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const eventId   = urlParams.get('event') || 'demo-event';

        // ─────────────────────────────────────────────
        // 2. STATE
        // ─────────────────────────────────────────────
        const root               = document.documentElement;
        const searchInput        = document.getElementById('searchInput');
        const mainContainer      = document.getElementById('main-content-container');
        const indicatorsContainer= document.getElementById('page-indicators');
        const keyboard           = document.getElementById('custom-keyboard');

        let guests          = [];
        let lastGuestJson   = null;   // guard: only re-render when guest data actually changes
        let currentLayout   = 'layout-grid';
        let tablesPerPage   = 15;
        let loopIntervalMs  = 8000;
        let idleTimeoutMs   = 15000;
        let burnInEnabled   = true;
        let currentPageIndex= 0;
        let loopTimer       = null;
        let idleTimer       = null;
        let kbIdleTimer     = null;
        let totalPages      = 0;
        const KB_TIMEOUT_MS = 8000;

        // ─────────────────────────────────────────────
        // 3. DEFAULTS
        // ─────────────────────────────────────────────
        function applyDefaults() {
            root.style.setProperty('--bg-color',      '#000000');
            root.style.setProperty('--text-color',    '#ffffff');
            root.style.setProperty('--font-main',     "'Helvetica Neue', Arial, sans-serif");
            root.style.setProperty('--title-size',    '3.5rem');
            root.style.setProperty('--table-size',    '1.4rem');
            root.style.setProperty('--guest-size',    '1.2rem');
            root.style.setProperty('--top-clearance', '25vh');
        }
        applyDefaults();

        // ─────────────────────────────────────────────
        // 4. RENDER ENGINE
        // ─────────────────────────────────────────────
        function renderTables() {
            if (!guests || guests.length === 0) {
                mainContainer.innerHTML = '<p style="text-align:center;width:100%;">Awaiting data from Cloud Database...</p>';
                indicatorsContainer.innerHTML = '';
                toggleNavArrows(false);
                clearInterval(loopTimer);
                return;
            }

            // Group by table
            const tables = {};
            guests.forEach(g => {
                const key = g.table || 'Unassigned';
                if (!tables[key]) tables[key] = [];
                tables[key].push(g);
            });

            const sortedTableNames = Object.keys(tables).sort((a, b) =>
                a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
            );

            // Paginate
            const pagesData = [];
            for (let i = 0; i < sortedTableNames.length; i += tablesPerPage) {
                pagesData.push(sortedTableNames.slice(i, i + tablesPerPage));
            }
            totalPages = pagesData.length;

            mainContainer.innerHTML    = '';
            indicatorsContainer.innerHTML = '';
            toggleNavArrows(totalPages > 1);

            pagesData.forEach((pageTables, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = `seating-page ${currentLayout}`;
                pageDiv.setAttribute('data-page-index', index);

                let html = '';
                pageTables.forEach(tableName => {
                    html += `<div class="table-group"><h3>Table ${tableName}</h3><ul>`;
                    tables[tableName]
                        .sort((a, b) => (a.last || '').localeCompare(b.last || ''))
                        .forEach(guest => {
                            const fullName   = `${guest.first || ''} ${guest.last || ''}`.trim();
                            const subDetails = [guest.title, guest.company].filter(Boolean).join(' | ');
                            const searchAttr = `${fullName} ${guest.company || ''} ${guest.title || ''}`.toLowerCase();
                            html += `
                                <li class="guest-item" data-search="${searchAttr}">
                                    <div class="guest-name">${fullName}</div>
                                    ${subDetails ? `<div class="guest-details">${subDetails}</div>` : ''}
                                </li>`;
                        });
                    html += `</ul></div>`;
                });

                pageDiv.innerHTML = html;
                mainContainer.appendChild(pageDiv);

                if (totalPages > 1) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.setAttribute('data-target', index);
                    dot.addEventListener('click', () => { handleInteraction(); showPage(index); });
                    indicatorsContainer.appendChild(dot);
                }
            });

            showPage(0);
            startLoop();
        }

        // ─────────────────────────────────────────────
        // 5. SEARCH  — highlight/fade (original style)
        // ─────────────────────────────────────────────
        function applySearch() {
            const query = searchInput.value.toLowerCase().trim();
            const items = document.querySelectorAll('.guest-item');

            if (query === '') {
                // Clear all highlight/fade, restore page view
                items.forEach(item => item.classList.remove('highlight', 'fade', 'hidden'));
                document.querySelectorAll('.table-group').forEach(tg => tg.style.display = '');
                document.querySelectorAll('.seating-page').forEach((p, i) =>
                    p.classList.toggle('active', i === currentPageIndex)
                );
                document.querySelectorAll('.dot').forEach(d => d.style.display = 'block');
                startLoop();
                return;
            }

            clearInterval(loopTimer); // Pause auto-loop during search

            let pagesWithMatches = new Set();

            items.forEach(item => {
                const match = item.getAttribute('data-search').includes(query);
                if (match) {
                    item.classList.add('highlight');
                    item.classList.remove('fade', 'hidden');
                    pagesWithMatches.add(parseInt(item.closest('.seating-page').getAttribute('data-page-index')));
                } else {
                    item.classList.remove('highlight');
                    item.classList.add('fade');
                }
            });

            // Hide dots for pages with no matches, show all pages so results are visible
            document.querySelectorAll('.seating-page').forEach(p => p.classList.add('active'));
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.style.display = pagesWithMatches.has(i) ? 'block' : 'none';
            });

            // Jump to first matching page if current page has no match
            if (pagesWithMatches.size > 0 && !pagesWithMatches.has(currentPageIndex)) {
                showPage(Math.min(...Array.from(pagesWithMatches)));
            }
        }

        // ─────────────────────────────────────────────
        // 6. NAVIGATION
        // ─────────────────────────────────────────────
        function showPage(index) {
            if (totalPages === 0) return;
            currentPageIndex = index;
            document.querySelectorAll('.seating-page').forEach((p, i) =>
                p.classList.toggle('active', i === index)
            );
            document.querySelectorAll('.dot').forEach((d, i) =>
                d.classList.toggle('active', i === index)
            );
        }

        function startLoop() {
            clearInterval(loopTimer);
            if (totalPages <= 1 || keyboard.classList.contains('active')) return;
            loopTimer = setInterval(() => {
                currentPageIndex = (currentPageIndex + 1) % totalPages;
                showPage(currentPageIndex);
            }, loopIntervalMs);
        }

        function toggleNavArrows(show) {
            document.getElementById('nav-prev').style.display = show ? 'block' : 'none';
            document.getElementById('nav-next').style.display = show ? 'block' : 'none';
        }

        document.getElementById('nav-prev').addEventListener('click', () => {
            if (totalPages <= 1) return;
            handleInteraction();
            showPage((currentPageIndex - 1 + totalPages) % totalPages);
        });
        document.getElementById('nav-next').addEventListener('click', () => {
            if (totalPages <= 1) return;
            handleInteraction();
            showPage((currentPageIndex + 1) % totalPages);
        });

        // ─────────────────────────────────────────────
        // 7. IDLE / INTERACTION
        // NOTE: NOT called from Firebase listener — prevents idle reset on every cloud push
        // ─────────────────────────────────────────────
        function resetKbIdleTimer() {
            clearTimeout(kbIdleTimer);
            if (keyboard.classList.contains('active')) {
                kbIdleTimer = setTimeout(() => keyboard.classList.remove('active'), KB_TIMEOUT_MS);
            }
        }

        function handleInteraction() {
            document.body.classList.remove('idle-mode');
            document.body.classList.add('active-mode');
            clearTimeout(idleTimer);
            clearInterval(loopTimer);
            resetKbIdleTimer();

            idleTimer = setTimeout(() => {
                searchInput.value = '';
                keyboard.classList.remove('active');
                applySearch();
                showPage(0);
                startLoop();
                if (burnInEnabled) {
                    document.body.classList.remove('active-mode');
                    document.body.classList.add('idle-mode');
                }
            }, idleTimeoutMs);

            startLoop();
        }

        // Touch / mouse / keyboard wakes screen
        window.addEventListener('touchstart', handleInteraction);
        window.addEventListener('mousemove',  handleInteraction);
        window.addEventListener('keydown',    handleInteraction);

        // ─────────────────────────────────────────────
        // 8. ON-SCREEN KEYBOARD
        // ─────────────────────────────────────────────
        searchInput.addEventListener('click', () => {
            keyboard.classList.add('active');
            handleInteraction();
            clearInterval(loopTimer); // Pause loop while keyboard open
        });

        // Letter keys
        document.querySelectorAll('.kb-key:not(.wide):not(.space)').forEach(btn => {
            btn.addEventListener('click', () => {
                searchInput.value += btn.innerText;
                handleInteraction();
                applySearch();
            });
        });

        document.getElementById('kb-space').addEventListener('click', () => {
            searchInput.value += ' ';
            handleInteraction();
            applySearch();
        });
        document.getElementById('kb-backspace').addEventListener('click', () => {
            searchInput.value = searchInput.value.slice(0, -1);
            handleInteraction();
            applySearch();
        });
        document.getElementById('kb-clear').addEventListener('click', () => {
            searchInput.value = '';
            handleInteraction();
            applySearch();
        });
        document.getElementById('kb-close').addEventListener('click', () => {
            keyboard.classList.remove('active');
            searchInput.value = '';
            applySearch();
            showPage(0);
            startLoop();
        });

        // Physical Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                keyboard.classList.remove('active');
                applySearch();
                showPage(0);
                startLoop();
            }
        });

        // ─────────────────────────────────────────────
        // 9. FIREBASE LISTENER
        // All keys applied. Re-render ONLY when guest data changes.
        // handleInteraction() intentionally NOT called here.
        // ─────────────────────────────────────────────
        db.ref('seating_charts/' + eventId).on('value', (snapshot) => {
            const data = snapshot.val();

            if (!data) {
                guests = [];
                lastGuestJson = null;
                applyDefaults();
                renderTables();
                document.getElementById('floorplan-container').style.display = 'none';
                document.getElementById('logo-display').style.display = 'none';
                return;
            }

            // Visual
            root.style.setProperty('--bg-color',      data.mh_bgColor      || '#000000');
            root.style.setProperty('--text-color',     data.mh_textColor    || '#ffffff');
            root.style.setProperty('--font-main',      data.mh_font         || "'Helvetica Neue', Arial, sans-serif");
            root.style.setProperty('--title-size',     data.mh_titleSize    || '3.5rem');
            root.style.setProperty('--table-size',     data.mh_tableSize    || '1.4rem');
            root.style.setProperty('--guest-size',     data.mh_guestSize    || '1.2rem');
            root.style.setProperty('--top-clearance',  data.mh_topClearance || '25vh');

            // Floorplan image (uploaded via operator panel)
            if (data.mh_floorplan_img) {
                document.getElementById('floorplan-display').src = data.mh_floorplan_img;
                document.getElementById('floorplan-container').style.display = 'block';
            }
            // Logo image
            if (data.mh_logo_img) {
                const logo = document.getElementById('logo-display');
                logo.src = data.mh_logo_img;
                logo.style.display = 'block';
            }

            // Timing
            tablesPerPage  = data.mh_tablesPerPage ? parseInt(data.mh_tablesPerPage)       : 15;
            loopIntervalMs = data.mh_loopInterval  ? parseInt(data.mh_loopInterval)  * 1000 : 8000;
            idleTimeoutMs  = data.mh_idleTimeout   ? parseInt(data.mh_idleTimeout)   * 1000 : 15000;
            burnInEnabled  = data.mh_burnIn        ? (data.mh_burnIn === 'true')             : true;

            // Layout
            if (data.mh_layout && data.mh_layout !== currentLayout) {
                currentLayout = data.mh_layout;
                document.querySelectorAll('.seating-page').forEach(p => {
                    p.className = `seating-page${p.classList.contains('active') ? ' active' : ''} ${currentLayout}`;
                });
            } else if (!data.mh_layout) {
                currentLayout = 'layout-grid';
            }

            // Guest data — only re-render if actually changed
            if (data.mh_guestData && data.mh_guestData !== lastGuestJson) {
                lastGuestJson = data.mh_guestData;
                guests = JSON.parse(data.mh_guestData);
                renderTables();
            } else if (!data.mh_guestData && lastGuestJson !== null) {
                lastGuestJson = null;
                guests = [];
                renderTables();
            }
        });

        // Kick off idle timer on load
        handleInteraction();
    </script>
</body>
</html>
