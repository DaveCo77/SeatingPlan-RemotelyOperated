<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Kiosk Display</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400;700&family=Open+Sans:wght@300;400;600&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;600&family=Oswald:wght@300;400;600&family=Raleway:wght@300;400;600&family=Poppins:wght@300;400;600&family=Nunito:wght@300;400;600&family=Merriweather:wght@300;400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --font-main: 'Helvetica Neue', Arial, sans-serif;
            --highlight: #0056b3; --highlight-text: #ffffff;
            --title-size: 3.5rem; --table-size: 1.4rem; --guest-size: 1.2rem;
            --top-clearance: 25vh; 
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; font-family: var(--font-main);
            color: var(--text-color);
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.9), 0px 1px 3px rgba(0,0,0,0.8);
            transition: color 0.3s, font-family 0.3s;
            background-color: var(--bg-color);
            background-image: url('QLD_Forum SeatplanBackground.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; overflow-x: hidden;
        }

        .display-area { display: flex; flex-direction: column; align-items: center; padding: var(--top-clearance) 3rem 3rem 3rem; max-width: 1400px; margin: 0 auto; transition: margin-top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        body.idle-mode #main-content-container { opacity: 0.25; transition: opacity 2s ease-in-out; }
        body.active-mode #main-content-container { opacity: 1; transition: opacity 0.5s ease-in-out; }
        
        .chart-header { text-align: center; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 2rem; }
        .chart-header h1 { font-size: var(--title-size); text-transform: uppercase; margin: 0; transition: font-size 0.3s; }
        
        .search-container { width: 100%; max-width: 800px; text-align: center; margin: 0 auto 4rem auto; position: relative; z-index: 1000; }
        #searchInput { width: 100%; padding: 1.2rem; font-size: 1.5rem; font-family: inherit; border: 2px solid var(--text-color); border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: var(--text-color); text-align: center; outline: none; transition: all 0.5s; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #searchInput:focus { border-color: var(--highlight); background: rgba(0, 0, 0, 0.85); }

        #main-content-container { width: 100%; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .seating-page { width: 100%; margin-bottom: 3rem; display: none; animation: fadeIn 0.6s ease-in-out forwards; }
        .seating-page.active.layout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4rem; }
        .seating-page.active.layout-columns { display: block; column-count: 3; column-gap: 4rem; }
        .seating-page.active.layout-list { display: flex; flex-direction: column; align-items: center; gap: 3rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .table-group { text-align: center; margin-bottom: 2rem; break-inside: avoid; page-break-inside: avoid; }
        .table-group h3 { font-size: var(--table-size); border-bottom: 2px solid var(--text-color); padding-bottom: 0.5rem; display: inline-block; transition: font-size 0.3s; }
        .table-group ul { list-style: none; padding: 0; margin: 0; line-height: 1.8; font-size: var(--guest-size); transition: font-size 0.3s; }
        
        .guest-item { transition: all 0.2s; padding: 0.5rem 0; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .guest-item.highlight { background-color: var(--highlight); color: var(--highlight-text); transform: scale(1.05); }
        .guest-item.fade { opacity: 0.2; }

        .page-indicators { display: flex; gap: 15px; margin-top: 2rem; align-items: center; }
        .dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.3s; cursor: pointer; }
        .dot.active { background: var(--text-color); transform: scale(1.3); }

        .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); font-size: 3rem; color: rgba(255,255,255,0.3); cursor: pointer; padding: 2rem; z-index: 100; display: none; }
        .nav-btn.left { left: 1rem; }
        .nav-btn.right { right: 1rem; }

        /* KEYBOARD STYLES */
        #custom-keyboard { position: absolute; top: calc(100% + 15px); left: 0; width: 100%; background: rgba(15, 15, 15, 0.95); padding: 20px; border-radius: 12px; box-shadow: 0 15px 50px rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; gap: 10px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; opacity: 0; visibility: hidden; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        #custom-keyboard.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .kb-row { display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 1000px; }
        .kb-key { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 20px 0; font-size: 1.4rem; font-family: var(--font-main); cursor: pointer; flex-grow: 1; user-select: none; }
        .kb-key.wide { flex-grow: 2; font-weight: bold; }
        .kb-key.space { flex-grow: 6; }
    </style>
</head>
<body class="active-mode">

    <div class="nav-btn left" id="nav-prev">&#10094;</div>
    <div class="nav-btn right" id="nav-next">&#10095;</div>

    <main class="display-area" id="main-content-container">
        <div class="chart-header">
            <img id="logo-display" src="" alt="Event Logo" style="display: none;">
            <h1>Seating Chart</h1>
        </div>

        <div class="search-container" id="search-wrapper">
            <input type="text" id="searchInput" placeholder="TAP HERE TO SEARCH YOUR NAME" readonly>
            <div id="custom-keyboard">
                <div class="kb-row"><button class="kb-key">Q</button><button class="kb-key">W</button><button class="kb-key">E</button><button class="kb-key">R</button><button class="kb-key">T</button><button class="kb-key">Y</button><button class="kb-key">U</button><button class="kb-key">I</button><button class="kb-key">O</button><button class="kb-key">P</button></div>
                <div class="kb-row"><button class="kb-key">A</button><button class="kb-key">S</button><button class="kb-key">D</button><button class="kb-key">F</button><button class="kb-key">G</button><button class="kb-key">H</button><button class="kb-key">J</button><button class="kb-key">K</button><button class="kb-key">L</button></div>
                <div class="kb-row"><button class="kb-key">Z</button><button class="kb-key">X</button><button class="kb-key">C</button><button class="kb-key">V</button><button class="kb-key">B</button><button class="kb-key">N</button><button class="kb-key">M</button><button class="kb-key wide" id="kb-backspace">DELETE</button></div>
                <div class="kb-row"><button class="kb-key wide" id="kb-clear">CLEAR</button><button class="kb-key space" id="kb-space">SPACE</button><button class="kb-key wide" id="kb-close">DONE</button></div>
            </div>
        </div>

        <div id="seating-chart-grid"></div>
        <div class="page-indicators" id="page-indicators"></div>
    </main>

    <script>
        const firebaseConfig = {const firebaseConfig = {
  apiKey: "AIzaSyBsdmq5cRa56FkA--ZHJCNeQK30CqNKOUg",
  authDomain: "mondrian-seating-plan.firebaseapp.com",
  databaseURL: "https://mondrian-seating-plan-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mondrian-seating-plan",
  storageBucket: "mondrian-seating-plan.firebasestorage.app",
  messagingSenderId: "10687041872",
  appId: "1:10687041872:web:eae592e4f9191f2ddc1c55",
  measurementId: "G-EYY57Q0WZ9"
        }; };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const eventId = new URLSearchParams(window.location.search).get('event') || 'demo-event';
        
        const searchInput = document.getElementById('searchInput');
        const keyboard = document.getElementById('custom-keyboard');
        const container = document.getElementById('main-content-container');
        
        let guests = [], tablesPerPage = 15, loopTimer, idleTimer, kbIdleTimer;

        // --- KEYBOARD & INTERACTION ---
        function openKeyboard() { 
            keyboard.classList.add('active'); 
            container.style.marginTop = '350px'; 
            clearInterval(loopTimer); 
        }

        function closeKeyboard() { 
            keyboard.classList.remove('active'); 
            container.style.marginTop = '0px'; 
            startLoop(); 
        }

        searchInput.addEventListener('click', openKeyboard);
        
        // Typing Logic
        document.querySelectorAll('.kb-key').forEach(btn => {
            btn.addEventListener('click', () => {
                if(btn.id === 'kb-backspace') searchInput.value = searchInput.value.slice(0, -1);
                else if(btn.id === 'kb-clear') searchInput.value = '';
                else if(btn.id === 'kb-close') closeKeyboard();
                else if(btn.id === 'kb-space') searchInput.value += ' ';
                else searchInput.value += btn.innerText;
                applySearch();
            });
        });

        // Firebase Sync
        db.ref('seating_charts/' + eventId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.mh_guestData) {
                guests = JSON.parse(data.mh_guestData);
                renderTables();
            }
        });

        function renderTables() {
            // Your rendering logic here...
        }
    </script>
</body>
</html>
