<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Kiosk Display</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400;700&family=Open+Sans:wght@300;400;600&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;600&family=Oswald:wght@300;400;600&family=Raleway:wght@300;400;600&family=Poppins:wght@300;400;600&family=Nunito:wght@300;400;600&family=Merriweather:wght@300;400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --font-main: 'Helvetica Neue', Arial, sans-serif;
            --highlight: #0056b3; --highlight-text: #ffffff;
            --title-size: 3.5rem; --table-size: 1.4rem; --guest-size: 1.2rem;
            --top-clearance: 25vh; 
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; font-family: var(--font-main);
            color: var(--text-color);
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.9), 0px 1px 3px rgba(0,0,0,0.8);
            transition: color 0.3s, font-family 0.3s;
            background-color: var(--bg-color);
            background-image: url('QLD_Forum SeatplanBackground.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; overflow-x: hidden;
        }

        .display-area { display: flex; flex-direction: column; align-items: center; padding: var(--top-clearance) 3rem 3rem 3rem; max-width: 1400px; margin: 0 auto; }
        body.idle-mode #main-content-container { opacity: 0.25; transition: opacity 2s ease-in-out; }
        body.active-mode #main-content-container { opacity: 1; transition: opacity 0.5s ease-in-out; }
        body.idle-mode .search-container input { border-color: rgba(255, 255, 255, 0.5); animation: borderPulse 4s infinite ease-in-out; }
        body.idle-mode .nav-btn, body.idle-mode .page-indicators { opacity: 0.1; transition: opacity 2s ease-in-out; }
        body.active-mode .nav-btn, body.active-mode .page-indicators { opacity: 1; transition: opacity 0.5s ease-in-out; }

        @keyframes borderPulse { 0% { box-shadow: 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 20px rgba(255,255,255,0.3); } 100% { box-shadow: 0 0 0 rgba(255,255,255,0); } }

        #floorplan-container { display: none; margin-bottom: 2rem; width: 100%; text-align: center; }
        #floorplan-display { max-height: 500px; max-width: 100%; border: 2px solid var(--text-color); object-fit: contain; }

        .chart-header { text-align: center; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 2rem; }
        .chart-header h1 { font-size: var(--title-size); text-transform: uppercase; margin: 0; transition: font-size 0.3s; }
        
        .search-container { width: 100%; max-width: 800px; text-align: center; margin: 0 auto 4rem auto; position: relative; z-index: 1000; }
        #searchInput { width: 100%; padding: 1.2rem; font-size: 1.5rem; font-family: inherit; border: 2px solid var(--text-color); border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: var(--text-color); text-align: center; outline: none; transition: all 0.5s; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #searchInput::placeholder { color: var(--text-color); opacity: 0.7; }
        #searchInput:focus { border-color: var(--highlight); background: rgba(0, 0, 0, 0.85); }

        #main-content-container { width: 100%; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .seating-page { width: 100%; margin-bottom: 3rem; display: none; animation: fadeIn 0.6s ease-in-out forwards; }
        .seating-page.active.layout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4rem; }
        .seating-page.active.layout-columns { display: block; column-count: 3; column-gap: 4rem; }
        @media (max-width: 1000px) { .seating-page.active.layout-columns { column-count: 2; } }
        @media (max-width: 600px) { .seating-page.active.layout-columns { column-count: 1; } }
        .seating-page.active.layout-list { display: flex; flex-direction: column; align-items: center; gap: 3rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .table-group { text-align: center; margin-bottom: 2rem; break-inside: avoid; page-break-inside: avoid; }
        .table-group h3 { font-size: var(--table-size); border-bottom: 2px solid var(--text-color); padding-bottom: 0.5rem; display: inline-block; transition: font-size 0.3s; }
        .table-group ul { list-style: none; padding: 0; margin: 0; line-height: 1.8; font-size: var(--guest-size); transition: font-size 0.3s; }
        
        .guest-item { transition: all 0.2s; padding: 0.5rem 0; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .guest-name { font-weight: normal; }
        .guest-details { font-size: 0.65em; opacity: 0.7; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }
        .guest-item.highlight { background-color: var(--highlight); color: var(--highlight-text); transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0,0.9); }
        .guest-item.highlight .guest-name { font-weight: bold; }
        .guest-item.fade { opacity: 0.2; }

        .page-indicators { display: flex; gap: 15px; margin-top: 2rem; align-items: center; }
        .dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.3s; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .dot:hover { background: rgba(255,255,255,0.6); transform: scale(1.1); }
        .dot.active { background: var(--text-color); transform: scale(1.3); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); font-size: 3rem; color: rgba(255,255,255,0.3); cursor: pointer; padding: 2rem; z-index: 100; transition: all 0.3s; user-select: none; display: none; }
        .nav-btn:hover { color: rgba(255,255,255,0.8); }
        .nav-btn:active { transform: translateY(-50%) scale(0.9); }
        .nav-btn.left { left: 1rem; }
        .nav-btn.right { right: 1rem; }

        #custom-keyboard { position: absolute; top: calc(100% + 15px); left: 0; width: 100%; background: rgba(15, 15, 15, 0.95); padding: 20px; border-radius: 12px; box-shadow: 0 15px 50px rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; gap: 10px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; opacity: 0; visibility: hidden; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        #custom-keyboard.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .kb-row { display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 1000px; }
        .kb-key { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 20px 0; font-size: 1.4rem; font-family: var(--font-main); cursor: pointer; flex-grow: 1; flex-basis: 0; user-select: none; transition: all 0.1s; }
        .kb-key:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
        .kb-key.wide { flex-grow: 2; font-size: 1.1rem; letter-spacing: 1px; font-weight: bold; }
        .kb-key.space { flex-grow: 6; }
        .kb-key.action-clear { background: rgba(179, 0, 0, 0.3); }
        .kb-key.action-close { background: rgba(0, 86, 179, 0.4); }
    </style>
</head>
<body class="active-mode">

    <div class="nav-btn left" id="nav-prev">&#10094;</div>
    <div class="nav-btn right" id="nav-next">&#10095;</div>

    <main class="display-area">
        <div id="floorplan-container"><img id="floorplan-display" src="" alt="Floorplan"></div>

        <div class="chart-header">
            <img id="logo-display" src="" alt="Event Logo" style="display: none;">
            <h1>Seating Chart</h1>
        </div>

        <div class="search-container" id="search-wrapper">
            <input type="text" id="searchInput" placeholder="TAP HERE TO SEARCH YOUR NAME" readonly>
            
            <div id="custom-keyboard">
                <div class="kb-row"><button class="kb-key">Q</button><button class="kb-key">W</button><button class="kb-key">E</button><button class="kb-key">R</button><button class="kb-key">T</button><button class="kb-key">Y</button><button class="kb-key">U</button><button class="kb-key">I</button><button class="kb-key">O</button><button class="kb-key">P</button></div>
                <div class="kb-row" style="width: 95%;"><button class="kb-key">A</button><button class="kb-key">S</button><button class="kb-key">D</button><button class="kb-key">F</button><button class="kb-key">G</button><button class="kb-key">H</button><button class="kb-key">J</button><button class="kb-key">K</button><button class="kb-key">L</button></div>
                <div class="kb-row" style="width: 90%;"><button class="kb-key">Z</button><button class="kb-key">X</button><button class="kb-key">C</button><button class="kb-key">V</button><button class="kb-key">B</button><button class="kb-key">N</button><button class="kb-key">M</button><button class="kb-key wide" id="kb-backspace">DELETE</button></div>
                <div class="kb-row"><button class="kb-key wide action-clear" id="kb-clear">CLEAR</button><button class="kb-key space" id="kb-space">SPACE</button><button class="kb-key wide action-close" id="kb-close">DONE</button></div>
            </div>
        </div>

        <div id="main-content-container">
            <p style="text-align: center; width: 100%;">Awaiting data from Cloud Database...</p>
        </div>

        <div class="page-indicators" id="page-indicators"></div>
    </main>

    <script>
        // ---------------------------------------------------------
        // 1. PASTE YOUR FIREBASE CONFIGURATION HERE
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ---------------------------------------------------------
        // 2. GET EVENT ID FROM URL (e.g., index.html?event=QLD-Gala)
        // ---------------------------------------------------------
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event') || 'demo-event';

        // ---------------------------------------------------------
        // 3. UI & APP LOGIC
        // ---------------------------------------------------------
        const root = document.documentElement;
        const searchInput = document.getElementById('searchInput');
        const mainContainer = document.getElementById('main-content-container');
        const indicatorsContainer = document.getElementById('page-indicators');
        const keyboard = document.getElementById('custom-keyboard');
        
        let guests = []; 
        let currentLayout = 'layout-grid';
        let tablesPerPage = 15;
        let loopIntervalMs = 8000;
        let idleTimeoutMs = 15000;
        let burnInEnabled = true; 
        
        let currentPageIndex = 0;
        let loopTimer = null;
        let idleTimer = null;
        let totalPages = 0;

        let kbIdleTimer = null;
        const KB_TIMEOUT_MS = 8000; 

        // Apply Defaults fallback
        function applyDefaults() {
            root.style.setProperty('--bg-color', '#000000');
            root.style.setProperty('--text-color', '#ffffff');
            root.style.setProperty('--font-main', "'Helvetica Neue', Arial, sans-serif");
            root.style.setProperty('--title-size', '3.5rem');
            root.style.setProperty('--table-size', '1.4rem');
            root.style.setProperty('--guest-size', '1.2rem');
            root.style.setProperty('--top-clearance', '25vh');
        }
        applyDefaults();

        function renderTables() {
            if (!guests || guests.length === 0) {
                mainContainer.innerHTML = '<p style="text-align: center; width: 100%;">Awaiting data from Cloud Database...</p>';
                indicatorsContainer.innerHTML = '';
                toggleNavArrows(false);
                clearInterval(loopTimer);
                return;
            }

            const tables = {};
            guests.forEach(g => { 
                if (!tables[g.table]) tables[g.table] = []; 
                tables[g.table].push(g); 
            });
            const sortedTableNames = Object.keys(tables).sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));

            const pagesData = [];
            for (let i = 0; i < sortedTableNames.length; i += tablesPerPage) {
                pagesData.push(sortedTableNames.slice(i, i + tablesPerPage));
            }
            totalPages = pagesData.length;

            mainContainer.innerHTML = '';
            indicatorsContainer.innerHTML = '';
            
            toggleNavArrows(totalPages > 1);

            pagesData.forEach((pageTables, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = `seating-page ${currentLayout}`;
                pageDiv.setAttribute('data-page-index', index);
                
                let html = '';
                pageTables.forEach(tableName => {
                    html += `<div class="table-group"><h3>Table ${tableName}</h3><ul>`;
                    
                    tables[tableName].sort((a, b) => a.last.localeCompare(b.last)).forEach(guest => {
                        const fullName = `${guest.first} ${guest.last}`.trim();
                        const subDetails = [guest.title, guest.company].filter(Boolean).join(' | ');
                        const searchString = `${fullName} ${guest.company} ${guest.title}`.toLowerCase();
                        
                        html += `
                            <li class="guest-item" data-search="${searchString}">
                                <div class="guest-name">${fullName}</div>
                                ${subDetails ? `<div class="guest-details">${subDetails}</div>` : ''}
                            </li>
                        `;
                    });
                    html += `</ul></div>`;
                });
                pageDiv.innerHTML = html;
                mainContainer.appendChild(pageDiv);

                if (totalPages > 1) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.setAttribute('data-target', index);
                    dot.addEventListener('click', () => { handleInteraction(); showPage(index); });
                    indicatorsContainer.appendChild(dot);
                }
            });

            showPage(0);
            startLoop();
        }

        function toggleNavArrows(show) {
            document.getElementById('nav-prev').style.display = show ? 'block' : 'none';
            document.getElementById('nav-next').style.display = show ? 'block' : 'none';
        }

        function showPage(index) {
            if(totalPages === 0) return;
            currentPageIndex = index;
            document.querySelectorAll('.seating-page').forEach((p, i) => {
                if (i === index) p.classList.add('active');
                else p.classList.remove('active');
            });
            document.querySelectorAll('.dot').forEach((d, i) => {
                if (i === index) d.classList.add('active');
                else d.classList.remove('active');
            });
        }

        function startLoop() {
            clearInterval(loopTimer);
            if (totalPages <= 1 || keyboard.classList.contains('active')) return; 
            loopTimer = setInterval(() => {
                let next = (currentPageIndex + 1) % totalPages;
                showPage(next);
            }, loopIntervalMs);
        }

        document.getElementById('nav-prev').addEventListener('click', () => {
            if(totalPages <= 1) return;
            handleInteraction(); 
            let prev = (currentPageIndex - 1 + totalPages) % totalPages;
            showPage(prev);
        });

        document.getElementById('nav-next').addEventListener('click', () => {
            if(totalPages <= 1) return;
            handleInteraction(); 
            let next = (currentPageIndex + 1) % totalPages;
            showPage(next);
        });

        function closeKeyboard() { keyboard.classList.remove('active'); }
        function openKeyboard() { keyboard.classList.add('active'); }
        function resetKbIdleTimer() {
            clearTimeout(kbIdleTimer);
            if (keyboard.classList.contains('active')) {
                kbIdleTimer = setTimeout(() => { closeKeyboard(); }, KB_TIMEOUT_MS);
            }
        }

        function handleInteraction() {
            document.body.classList.remove('idle-mode');
            document.body.classList.add('active-mode');
            clearTimeout(idleTimer); clearInterval(loopTimer); resetKbIdleTimer();

            idleTimer = setTimeout(() => {
                searchInput.value = ''; closeKeyboard(); applySearch(); showPage(0); startLoop();   
                if (burnInEnabled) {
                    document.body.classList.remove('active-mode');
                    document.body.classList.add('idle-mode');
                }
            }, idleTimeoutMs);
        }

        function applySearch() {
            handleInteraction(); 
            const query = searchInput.value.toLowerCase().trim();
            const items = document.querySelectorAll('.guest-item');
            
            if (query === '') {
                items.forEach(item => item.classList.remove('highlight', 'fade'));
                document.querySelectorAll('.dot').forEach(d => d.style.display = 'block');
                startLoop(); 
                return;
            }

            let pagesWithMatches = new Set();
            items.forEach(item => {
                const searchData = item.getAttribute('data-search');
                if (searchData.includes(query)) {
                    item.classList.add('highlight'); item.classList.remove('fade');
                    pagesWithMatches.add(parseInt(item.closest('.seating-page').getAttribute('data-page-index')));
                } else {
                    item.classList.remove('highlight'); item.classList.add('fade');
                }
            });

            document.querySelectorAll('.dot').forEach((d, i) => {
                d.style.display = pagesWithMatches.has(i) ? 'block' : 'none';
            });

            if (pagesWithMatches.size > 0 && !pagesWithMatches.has(currentPageIndex)) {
                showPage(Math.min(...Array.from(pagesWithMatches)));
            }
        }

        searchInput.addEventListener('click', () => { openKeyboard(); handleInteraction(); });
        document.querySelectorAll('.kb-key:not(.wide):not(.space)').forEach(btn => {
            btn.addEventListener('click', () => { searchInput.value += btn.innerText; applySearch(); });
        });
        document.getElementById('kb-space').addEventListener('click', () => { searchInput.value += ' '; applySearch(); });
        document.getElementById('kb-backspace').addEventListener('click', () => { searchInput.value = searchInput.value.slice(0, -1); applySearch(); });
        document.getElementById('kb-clear').addEventListener('click', () => { searchInput.value = ''; applySearch(); });
        document.getElementById('kb-close').addEventListener('click', () => { closeKeyboard(); startLoop(); });

        window.addEventListener('touchstart', handleInteraction);
        window.addEventListener('mousemove', handleInteraction);
        window.addEventListener('keydown', handleInteraction);

        // ---------------------------------------------------------
        // 4. CLOUD DATABASE LISTENER (REPLACES LOCALSTORAGE)
        // ---------------------------------------------------------
        db.ref('seating_charts/' + eventId).on('value', (snapshot) => {
            const data = snapshot.val();
            
            // If the node is empty or was purged, reset everything
            if (!data) {
                guests = [];
                applyDefaults();
                document.getElementById('floorplan-container').style.display = 'none';
                document.getElementById('logo-display').style.display = 'none';
                renderTables();
                return;
            }

            // Apply Visuals
            if (data.mh_bgColor) root.style.setProperty('--bg-color', data.mh_bgColor);
            if (data.mh_textColor) root.style.setProperty('--text-color', data.mh_textColor);
            if (data.mh_font) root.style.setProperty('--font-main', data.mh_font);
            if (data.mh_titleSize) root.style.setProperty('--title-size', data.mh_titleSize);
            if (data.mh_tableSize) root.style.setProperty('--table-size', data.mh_tableSize);
            if (data.mh_guestSize) root.style.setProperty('--guest-size', data.mh_guestSize);
            if (data.mh_topClearance) root.style.setProperty('--top-clearance', data.mh_topClearance);
            
            // Apply Layout
            if (data.mh_layout && data.mh_layout !== currentLayout) {
                currentLayout = data.mh_layout;
                document.querySelectorAll('.seating-page').forEach(p => {
                    p.className = `seating-page ${p.classList.contains('active') ? 'active' : ''} ${currentLayout}`;
                });
            }

            // Apply Settings
            if (data.mh_tablesPerPage) tablesPerPage = parseInt(data.mh_tablesPerPage);
            if (data.mh_loopInterval) loopIntervalMs = parseInt(data.mh_loopInterval) * 1000;
            if (data.mh_idleTimeout) idleTimeoutMs = parseInt(data.mh_idleTimeout) * 1000;
            if (data.mh_burnIn) burnInEnabled = data.mh_burnIn === 'true';

            // Handle Images (if present)
            if (data.mh_floorplan_img) {
                document.getElementById('floorplan-display').src = data.mh_floorplan_img;
                document.getElementById('floorplan-container').style.display = 'block';
            } else {
                document.getElementById('floorplan-container').style.display = 'none';
            }

            // Handle Data
            if (data.mh_guestData) {
                guests = JSON.parse(data.mh_guestData);
                renderTables();
            } else {
                guests = [];
                renderTables();
            }

            handleInteraction(); 
        });

    </script>
</body>
</html>
