<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Kiosk Display</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400;700&family=Open+Sans:wght@300;400;600&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;600&family=Oswald:wght@300;400;600&family=Raleway:wght@300;400;600&family=Poppins:wght@300;400;600&family=Nunito:wght@300;400;600&family=Merriweather:wght@300;400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --font-main: 'Helvetica Neue', Arial, sans-serif;
            --highlight: #0056b3; --highlight-text: #ffffff;
            --title-size: 3.5rem; --table-size: 1.4rem; --guest-size: 1.2rem;
            --top-clearance: 25vh; 
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; font-family: var(--font-main);
            color: var(--text-color);
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.9), 0px 1px 3px rgba(0,0,0,0.8);
            background-color: var(--bg-color);
            background-image: url('QLD_Forum SeatplanBackground.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; overflow-x: hidden;
        }

        .display-area { display: flex; flex-direction: column; align-items: center; padding: var(--top-clearance) 3rem 3rem 3rem; max-width: 1400px; margin: 0 auto; transition: margin-top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        .chart-header { text-align: center; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 2rem; }
        .chart-header h1 { font-size: var(--title-size); text-transform: uppercase; margin: 0; }
        
        .search-container { width: 100%; max-width: 800px; text-align: center; margin: 0 auto 4rem auto; position: relative; z-index: 1000; }
        #searchInput { width: 100%; padding: 1.2rem; font-size: 1.5rem; font-family: inherit; border: 2px solid var(--text-color); border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: var(--text-color); text-align: center; outline: none; transition: all 0.5s; cursor: pointer; backdrop-filter: blur(10px); }

        #main-content-container { width: 100%; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .seating-page { width: 100%; margin-bottom: 3rem; display: none; animation: fadeIn 0.6s ease-in-out forwards; }
        .seating-page.active { display: block; }
        .seating-page.active.layout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4rem; }
        
        .table-group { text-align: center; margin-bottom: 2rem; break-inside: avoid; }
        .table-group h3 { font-size: var(--table-size); border-bottom: 2px solid var(--text-color); padding-bottom: 0.5rem; display: inline-block; }
        .table-group ul { list-style: none; padding: 0; line-height: 1.8; font-size: var(--guest-size); }
        
        .guest-item { padding: 0.5rem 0; }
        .guest-item.highlight { background-color: var(--highlight); font-weight: bold; }
        
        .page-indicators { display: flex; gap: 15px; margin-top: 2rem; }
        .dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
        .dot.active { background: var(--text-color); }

        /* Keyboard styles... (keep your existing CSS) */
        #custom-keyboard { position: absolute; top: calc(100% + 15px); left: 0; width: 100%; background: rgba(15, 15, 15, 0.95); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; visibility: hidden; transition: all 0.3s; }
        #custom-keyboard.active { opacity: 1; visibility: visible; }
        .kb-row { display: flex; justify-content: center; gap: 8px; width: 100%; }
        .kb-key { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <main class="display-area" id="main-content-container">
        <div class="chart-header">
            <img id="logo-display" src="" alt="Event Logo" style="display: none;">
            <h1>Seating Chart</h1>
        </div>

        <div class="search-container" id="search-wrapper">
            <input type="text" id="searchInput" placeholder="TAP HERE TO SEARCH" readonly>
            <div id="custom-keyboard">
                <button class="kb-key" id="kb-close">DONE</button>
            </div>
        </div>
    </main>

    <script>
        // FIXED CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBsdmq5cRa56FkA--ZHJCNeQK30CqNKOUg",
            authDomain: "mondrian-seating-plan.firebaseapp.com",
            databaseURL: "https://mondrian-seating-plan-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mondrian-seating-plan",
            storageBucket: "mondrian-seating-plan.firebasestorage.app",
            messagingSenderId: "10687041872",
            appId: "1:10687041872:web:eae592e4f9191f2ddc1c55",
            measurementId: "G-EYY57Q0WZ9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const eventId = new URLSearchParams(window.location.search).get('event') || 'demo-event';
        
        const searchInput = document.getElementById('searchInput');
        const keyboard = document.getElementById('custom-keyboard');
        const container = document.getElementById('main-content-container');
        
        let guests = [];
        let currentPageIndex = 0;
        let tablesPerPage = 15;

        // FIXED RENDER ENGINE
        function renderTables() {
            if (!guests.length) return;

            const tables = {};
            guests.forEach(g => { 
                if (!tables[g.table]) tables[g.table] = []; 
                tables[g.table].push(g); 
            });
            const sortedTableNames = Object.keys(tables).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));

            // Clear old data
            // Note: Ensure your HTML has a container inside the main-content-container to clear
            container.innerHTML += '<div id="seating-chart-grid"></div>'; 
            const grid = document.getElementById('seating-chart-grid');
            grid.innerHTML = '';

            sortedTableNames.forEach(tableName => {
                const div = document.createElement('div');
                div.className = 'table-group';
                div.innerHTML = `<h3>Table ${tableName}</h3><ul>${tables[tableName].map(g => `<li>${g.first} ${g.last}</li>`).join('')}</ul>`;
                grid.appendChild(div);
            });
        }

        // FETCH DATA
        db.ref('seating_charts/' + eventId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.mh_guestData) {
                guests = JSON.parse(data.mh_guestData);
                renderTables();
            }
        });
    </script>
</body>
</html>
